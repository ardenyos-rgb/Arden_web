<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1940" viewBox="0 0 1920 1940" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Workflow tugas ARDEN OS</title><desc id="diagram-desc">Workflow tugas dengan cabang evidence yang belum cukup ke perbaikan, kegagalan provider ke checkpoint dan blocked, internal output langsung disimpan, eksternal melalui approval Arden, larangan ditolak, dan unknown melalui rekonsiliasi tanpa kirim ulang buta.</desc><defs><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#78d9e8"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#e99c94"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#e1b76e"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1940" rx="0" fill="#0b1219" stroke="#0b1219" stroke-width="2"/><rect x="620" y="208" width="680" height="82" rx="14" fill="#101b25" stroke="#2a3a46" stroke-width="2"/><path d="M960,290 L960,330" fill="none" stroke="#78d9e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><rect x="620" y="330" width="680" height="104" rx="14" fill="#102631" stroke="#78d9e8" stroke-width="2"/><path d="M960,434 L960,478" fill="none" stroke="#78d9e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><rect x="620" y="478" width="680" height="106" rx="14" fill="#101b25" stroke="#2a3a46" stroke-width="2"/><path d="M960,584 L960,628" fill="none" stroke="#78d9e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><rect x="620" y="628" width="680" height="108" rx="14" fill="#101b25" stroke="#2a3a46" stroke-width="2"/><path d="M960,736 L960,785" fill="none" stroke="#78d9e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><path d="M 960 785 L 1200 850 L 960 915 L 720 850 Z" fill="#102631" stroke="#78d9e8" stroke-width="2"/><path d="M960,915 L960,966" fill="none" stroke="#78d9e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><rect x="620" y="966" width="680" height="112" rx="14" fill="#251f17" stroke="#e1b76e" stroke-width="2"/><rect x="64" y="470" width="440" height="135" rx="14" fill="#291a1d" stroke="#e99c94" stroke-width="2"/><path d="M620,530 L504,530" fill="none" stroke="#e99c94" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow-red)"/><path d="M284,470 L284,382 L620,382" fill="none" stroke="#e99c94" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow-red)"/><rect x="64" y="798" width="440" height="110" rx="14" fill="#291a1d" stroke="#e99c94" stroke-width="2"/><path d="M720,850 L504,850" fill="none" stroke="#e99c94" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-red)"/><path d="M284,798 L284,682 L620,682" fill="none" stroke="#e99c94" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow-red)"/><rect x="64" y="982" width="440" height="114" rx="14" fill="#102631" stroke="#78d9e8" stroke-width="2"/><path d="M620,1022 L504,1022" fill="none" stroke="#78d9e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><rect x="1416" y="966" width="440" height="168" rx="14" fill="#251f17" stroke="#e1b76e" stroke-width="2"/><path d="M1300,1022 L1416,1022" fill="none" stroke="#e1b76e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-amber)"/><rect x="760" y="1120" width="400" height="76" rx="14" fill="#291a1d" stroke="#e99c94" stroke-width="2"/><path d="M960,1078 L960,1120" fill="none" stroke="#e99c94" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-red)"/><rect x="620" y="1260" width="680" height="94" rx="14" fill="#101b25" stroke="#2a3a46" stroke-width="2"/><path d="M1636,1134 L1636,1307 L1300,1307" fill="none" stroke="#e1b76e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-amber)"/><path d="M960,1354 L960,1410" fill="none" stroke="#78d9e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><rect x="620" y="1410" width="680" height="90" rx="14" fill="#101b25" stroke="#2a3a46" stroke-width="2"/><path d="M960,1500 L960,1530" fill="none" stroke="#78d9e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><path d="M 960 1530 L 1200 1595 L 960 1660 L 720 1595 Z" fill="#102631" stroke="#78d9e8" stroke-width="2"/><rect x="1416" y="1532" width="440" height="136" rx="14" fill="#291a1d" stroke="#e99c94" stroke-width="2"/><path d="M1200,1595 L1416,1595" fill="none" stroke="#e99c94" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-red)"/><path d="M1636,1532 L1636,1455 L1300,1455" fill="none" stroke="#e99c94" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow-red)"/><path d="M960,1660 L960,1720" fill="none" stroke="#78d9e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><rect x="620" y="1720" width="680" height="112" rx="14" fill="#102631" stroke="#78d9e8" stroke-width="2"/><path d="M284,1096 L284,1776 L620,1776" fill="none" stroke="#78d9e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><text x="64" y="83" font-size="48" fill="#eaf2f6" font-weight="700" text-anchor="start">ARDEN OS</text><text x="64" y="129" font-size="28" fill="#78d9e8" font-weight="600" text-anchor="start">Workflow per tugas</text><text x="64" y="169" font-size="19" fill="#a5b6c4" font-weight="400" text-anchor="start">Alur sukses, perbaikan, approval dan pemulihan hasil yang belum pasti.</text><text x="1856" y="77" font-size="17" fill="#78d9e8" font-weight="700" text-anchor="end">RANCANGAN REVISI</text><text x="1856" y="108" font-size="17" fill="#a5b6c4" font-weight="400" text-anchor="end">30 OKTOBER 2026</text><text x="644" y="243" font-size="24" fill="#eaf2f6" font-weight="650" text-anchor="start">INPUT → EVENT TERSIMPAN</text><text x="644" y="272" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Verifikasi sumber, normalisasi dan dedupe</text><text x="644" y="365" font-size="24" fill="#eaf2f6" font-weight="650" text-anchor="start">NOVA MEMBENTUK TASK</text><text x="644" y="394" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Objective, satu owner, kriteria penerimaan,</text><text x="644" y="419" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">deadline, next action, risiko dan budget</text><text x="644" y="513" font-size="24" fill="#eaf2f6" font-weight="650" text-anchor="start">PILIH ROUTE YANG SAH</text><text x="644" y="542" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Script untuk deterministik; Flash / Pro / GPT</text><text x="644" y="567" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">berdasarkan tugas, data, izin dan allowance</text><text x="644" y="663" font-size="24" fill="#eaf2f6" font-weight="650" text-anchor="start">KERJAKAN + SIMPAN EVIDENCE</text><text x="644" y="692" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Specialist sesuai kebutuhan, checkpoint dan run ID.</text><text x="644" y="717" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Catat provider/model aktual serta pemakaian.</text><text x="960" y="845" font-size="24" fill="#eaf2f6" font-weight="650" text-anchor="middle">Bukti memenuhi</text><text x="960" y="874" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="middle">seluruh kriteria?</text><text x="980" y="946" font-size="16" fill="#78d9e8" font-weight="700" text-anchor="start">YA</text><text x="644" y="1001" font-size="24" fill="#eaf2f6" font-weight="650" text-anchor="start">POLICY GATE</text><text x="644" y="1030" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Tentukan internal/draft, approval, atau dilarang.</text><text x="644" y="1055" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Policy service memutuskan kewenangan.</text><text x="88" y="505" font-size="22" fill="#e99c94" font-weight="650" text-anchor="start">PROVIDER / QUOTA GAGAL</text><text x="88" y="534" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Checkpoint → blocked + alert.</text><text x="88" y="559" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Fallback hanya allowlist berizin;</text><text x="88" y="584" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">jika tidak ada, tunggu pemulihan.</text><text x="528" y="511" font-size="15" fill="#e99c94" font-weight="650" text-anchor="start">GAGAL</text><text x="310" y="366" font-size="14" fill="#e99c94" font-weight="650" text-anchor="start">RESUME SETELAH HAMBATAN SELESAI</text><text x="88" y="833" font-size="22" fill="#e99c94" font-weight="650" text-anchor="start">PERBAIKAN / BLOCKED</text><text x="88" y="862" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Bukti belum cukup. Ulang terbatas</text><text x="88" y="887" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">sesuai budget atau minta informasi.</text><text x="544" y="833" font-size="15" fill="#e99c94" font-weight="700" text-anchor="start">TIDAK</text><text x="88" y="1017" font-size="22" fill="#eaf2f6" font-weight="650" text-anchor="start">INTERNAL / DRAFT</text><text x="88" y="1046" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Simpan artefak terverifikasi.</text><text x="88" y="1071" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Tidak melakukan aksi eksternal.</text><text x="520" y="1004" font-size="14" fill="#78d9e8" font-weight="650" text-anchor="start">INTERNAL</text><text x="1440" y="1001" font-size="22" fill="#eaf2f6" font-weight="650" text-anchor="start">APPROVAL ARDEN</text><text x="1440" y="1030" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Target + payload hash + expiry.</text><text x="1440" y="1055" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Disetujui: izinkan satu eksekusi.</text><text x="1440" y="1080" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Ditolak / expired: tahan tindakan,</text><text x="1440" y="1105" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">catat keputusan dan next action.</text><text x="1315" y="1004" font-size="14" fill="#e1b76e" font-weight="650" text-anchor="start">BUTUH IZIN</text><text x="784" y="1155" font-size="22" fill="#e99c94" font-weight="650" text-anchor="start">DILARANG → TOLAK</text><text x="960" y="1175" font-size="17" fill="#e99c94" font-weight="400" text-anchor="middle">Tidak dieksekusi</text><text x="644" y="1295" font-size="24" fill="#eaf2f6" font-weight="650" text-anchor="start">OUTBOX → EXECUTOR TERBATAS</text><text x="644" y="1324" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Cek ulang izin, hash, precondition dan idempotency.</text><text x="1656" y="1234" font-size="16" fill="#e1b76e" font-weight="700" text-anchor="start">IZIN SAH</text><text x="644" y="1445" font-size="24" fill="#eaf2f6" font-weight="650" text-anchor="start">RECEIPT + VERIFIKASI HASIL</text><text x="644" y="1474" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Konfirmasi hasil sesuai tingkat bukti layanan.</text><text x="960" y="1590" font-size="24" fill="#eaf2f6" font-weight="650" text-anchor="middle">Hasil aksi</text><text x="960" y="1619" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="middle">terkonfirmasi?</text><text x="1440" y="1567" font-size="22" fill="#e99c94" font-weight="650" text-anchor="start">UNKNOWN → REKONSILIASI</text><text x="1440" y="1596" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Cari receipt / status di sumber.</text><text x="1440" y="1621" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Jangan kirim ulang secara buta.</text><text x="1440" y="1646" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Gagal pasti: catat failed + recovery.</text><text x="1240" y="1577" font-size="15" fill="#e99c94" font-weight="650" text-anchor="start">BELUM PASTI</text><text x="1418" y="1436" font-size="14" fill="#e99c94" font-weight="650" text-anchor="start">CEK ULANG, BUKAN KIRIM ULANG</text><text x="980" y="1696" font-size="16" fill="#78d9e8" font-weight="700" text-anchor="start">BERHASIL</text><text x="644" y="1755" font-size="24" fill="#eaf2f6" font-weight="650" text-anchor="start">DONE + RADAR + DECISION MEMORY</text><text x="644" y="1784" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Tutup jika seluruh kriteria dan efek wajib terpenuhi.</text><text x="644" y="1809" font-size="18" fill="#a5b6c4" font-weight="400" text-anchor="start">Nova memberi ringkasan dan next action ke Arden.</text><text x="306" y="1710" font-size="16" fill="#78d9e8" font-weight="650" text-anchor="start">ARTEFAK INTERNAL</text><text x="306" y="1737" font-size="16" fill="#78d9e8" font-weight="650" text-anchor="start">LOLOS VALIDASI</text><text x="64" y="1888" font-size="21" fill="#78d9e8" font-weight="600" text-anchor="start">Aturan tetap: rekomendasi ≠ keputusan • draft ≠ terkirim • quota blocked ≠ hasil aksi unknown</text><text x="64" y="1919" font-size="17" fill="#a5b6c4" font-weight="400" text-anchor="start">Diagram rancangan 1.2; implementasi dan konfigurasi aktif belum diperiksa dalam revisi ini.</text></g></svg>