<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1470" viewBox="0 0 1920 1470" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Arsitektur ARDEN OS, sembilan agent</title><desc id="diagram-desc">Rancangan arsitektur: input menuju ingestion dan task store, Nova, delapan specialist, validasi evidence, policy dan approval, executor, lalu receipt serta update status. Dua jalur model adalah opencode-go dan openai-codex.</desc><defs><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#226347"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#964940"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#80581f"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1470" rx="0" fill="#f6f8f5" stroke="#f6f8f5" stroke-width="2"/><rect x="64" y="208" width="1260" height="88" rx="14" fill="#ffffff" stroke="#cdd8cf" stroke-width="2"/><path d="M694,296 L694,328" fill="none" stroke="#226347" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><rect x="64" y="328" width="1260" height="88" rx="14" fill="#ffffff" stroke="#cdd8cf" stroke-width="2"/><path d="M694,416 L694,448" fill="none" stroke="#226347" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><rect x="64" y="448" width="1260" height="100" rx="14" fill="#e6f0e7" stroke="#226347" stroke-width="2"/><path d="M694,548 L694,580" fill="none" stroke="#226347" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><rect x="64" y="580" width="1260" height="278" rx="14" fill="#e6f0e7" stroke="#cdd8cf" stroke-width="2"/><rect x="88" y="636" width="288" height="88" rx="14" fill="#ffffff" stroke="#cdd8cf" stroke-width="2"/><rect x="392" y="636" width="288" height="88" rx="14" fill="#ffffff" stroke="#cdd8cf" stroke-width="2"/><rect x="696" y="636" width="288" height="88" rx="14" fill="#ffffff" stroke="#cdd8cf" stroke-width="2"/><rect x="1000" y="636" width="288" height="88" rx="14" fill="#ffffff" stroke="#cdd8cf" stroke-width="2"/><rect x="88" y="742" width="288" height="88" rx="14" fill="#ffffff" stroke="#cdd8cf" stroke-width="2"/><rect x="392" y="742" width="288" height="88" rx="14" fill="#ffffff" stroke="#cdd8cf" stroke-width="2"/><rect x="696" y="742" width="288" height="88" rx="14" fill="#ffffff" stroke="#cdd8cf" stroke-width="2"/><rect x="1000" y="742" width="288" height="88" rx="14" fill="#ffffff" stroke="#cdd8cf" stroke-width="2"/><path d="M694,858 L694,890" fill="none" stroke="#226347" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><rect x="64" y="890" width="1260" height="88" rx="14" fill="#ffffff" stroke="#cdd8cf" stroke-width="2"/><path d="M694,978 L694,1010" fill="none" stroke="#226347" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><rect x="64" y="1010" width="1260" height="90" rx="14" fill="#faf0de" stroke="#80581f" stroke-width="2"/><path d="M694,1100 L694,1132" fill="none" stroke="#226347" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><rect x="64" y="1132" width="1260" height="90" rx="14" fill="#ffffff" stroke="#cdd8cf" stroke-width="2"/><path d="M694,1222 L694,1254" fill="none" stroke="#226347" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><rect x="64" y="1254" width="1260" height="90" rx="14" fill="#e6f0e7" stroke="#226347" stroke-width="2"/><rect x="1408" y="208" width="448" height="210" rx="14" fill="#e6f0e7" stroke="#226347" stroke-width="2"/><rect x="1408" y="448" width="448" height="210" rx="14" fill="#ffffff" stroke="#cdd8cf" stroke-width="2"/><rect x="1408" y="704" width="448" height="258" rx="14" fill="#ffffff" stroke="#cdd8cf" stroke-width="2"/><rect x="1408" y="1010" width="448" height="248" rx="14" fill="#fbefec" stroke="#964940" stroke-width="2"/><rect x="64" y="1390" width="1792" height="48" rx="8" fill="#e6f0e7" stroke="#cdd8cf" stroke-width="2"/><text x="64" y="83" font-size="48" fill="#20382d" font-weight="700" text-anchor="start">ARDEN OS</text><text x="64" y="129" font-size="28" fill="#226347" font-weight="600" text-anchor="start">Arsitektur sembilan agent</text><text x="64" y="169" font-size="19" fill="#53675d" font-weight="400" text-anchor="start">Nova mengoordinasikan pekerjaan; policy dan executor mengendalikan tindakan.</text><text x="1856" y="77" font-size="17" fill="#226347" font-weight="700" text-anchor="end">RANCANGAN REVISI</text><text x="1856" y="108" font-size="17" fill="#53675d" font-weight="400" text-anchor="end">30 OKTOBER 2026</text><text x="88" y="243" font-size="24" fill="#20382d" font-weight="650" text-anchor="start">SUMBER &amp; PEMICU</text><text x="88" y="272" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Instruksi Arden  /  inbox  /  Calendar  /  Drive &amp; Sheets  /  repository  /  jadwal &amp; webhook</text><text x="88" y="363" font-size="24" fill="#20382d" font-weight="650" text-anchor="start">INGESTION + TASK STORE</text><text x="88" y="392" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Script: verifikasi sumber, dedupe, cursor, task ID, satu pemilik, deadline dan kriteria selesai.</text><text x="88" y="483" font-size="24" fill="#20382d" font-weight="650" text-anchor="start">NOVA | PERSONAL CHIEF OF STAFF</text><text x="88" y="512" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Objective, prioritas, assignment, route, budget, review dan penutupan loop.</text><text x="88" y="537" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Model utama usulan: DeepSeek Pro; eskalasi strategis: GPT-5.6 Sol.</text><text x="88" y="613" font-size="17" fill="#226347" font-weight="700" text-anchor="start">DELAPAN SPECIALIST | DIPANGGIL SESUAI TUGAS</text><text x="112" y="671" font-size="22" fill="#20382d" font-weight="650" text-anchor="start">Coder</text><text x="112" y="700" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Kode, integrasi, tests</text><text x="416" y="671" font-size="22" fill="#20382d" font-weight="650" text-anchor="start">Writer</text><text x="416" y="700" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Dokumen, proposal, email</text><text x="720" y="671" font-size="22" fill="#20382d" font-weight="650" text-anchor="start">Research</text><text x="720" y="700" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Riset, verifikasi, evidence</text><text x="1024" y="671" font-size="22" fill="#20382d" font-weight="650" text-anchor="start">Hunter</text><text x="1024" y="700" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Prospek dan peluang</text><text x="112" y="777" font-size="22" fill="#20382d" font-weight="650" text-anchor="start">Automator</text><text x="112" y="806" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Jadwal, monitoring, recovery</text><text x="416" y="777" font-size="22" fill="#20382d" font-weight="650" text-anchor="start">Operational</text><text x="416" y="806" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Task, proyek, CRM, KPI</text><text x="720" y="777" font-size="22" fill="#20382d" font-weight="650" text-anchor="start">Content</text><text x="720" y="806" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Naskah, storyboard, media</text><text x="1024" y="777" font-size="22" fill="#20382d" font-weight="650" text-anchor="start">CS</text><text x="1024" y="806" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Triage dan respons pelanggan</text><text x="88" y="925" font-size="24" fill="#20382d" font-weight="650" text-anchor="start">EVIDENCE + VALIDATOR</text><text x="88" y="954" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Bukti terikat acceptance criteria. Tidak cukup: perbaiki / blocked; jangan klaim done.</text><text x="88" y="1045" font-size="24" fill="#20382d" font-weight="650" text-anchor="start">POLICY GATE + APPROVAL ARDEN</text><text x="88" y="1074" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Internal otomatis / draft saja / approval per tindakan / dilarang. Izin mendahului efek eksternal.</text><text x="88" y="1167" font-size="24" fill="#20382d" font-weight="650" text-anchor="start">EXECUTOR TERBATAS + OUTBOX</text><text x="88" y="1196" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Hanya aksi yang berizin: cek payload hash, expiry, scope dan idempotency sebelum eksekusi.</text><text x="88" y="1289" font-size="24" fill="#20382d" font-weight="650" text-anchor="start">RECEIPT + REKONSILIASI + UPDATE STATUS</text><text x="88" y="1318" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Konfirmasi hasil, simpan evidence dan keputusan; perbarui radar, briefing dan next action.</text><text x="1432" y="243" font-size="23" fill="#20382d" font-weight="650" text-anchor="start">ROUTING DEEPSEEK</text><text x="1432" y="272" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Provider: opencode-go</text><text x="1432" y="297" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Flash: deepseek-v4.1-flash</text><text x="1432" y="322" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Pro: deepseek-v4-pro</text><text x="1432" y="347" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Rutin / volume → penalaran teknis</text><text x="1432" y="483" font-size="23" fill="#20382d" font-weight="650" text-anchor="start">ROUTING GPT-5.6</text><text x="1432" y="512" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Provider: openai-codex</text><text x="1432" y="537" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Luna / Terra / Sol</text><text x="1432" y="562" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Dokumen / sintesis / kreatif</text><text x="1432" y="587" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Sol: alasan eskalasi wajib</text><text x="1432" y="739" font-size="23" fill="#20382d" font-weight="650" text-anchor="start">KONTROL BERSAMA</text><text x="1432" y="768" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Script untuk proses deterministik</text><text x="1432" y="793" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Task / Run / Evidence / Action</text><text x="1432" y="818" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Approval / Decision / Audit</text><text x="1432" y="843" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Izin alat terpisah per fungsi</text><text x="1432" y="868" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Budget, checkpoint dan watchdog</text><text x="1432" y="893" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Sembilan agent ≠ sembilan worker</text><text x="1432" y="1045" font-size="23" fill="#964940" font-weight="650" text-anchor="start">JIKA TERJADI GANGGUAN</text><text x="1432" y="1074" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Quota / auth / provider gagal:</text><text x="1432" y="1099" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">checkpoint → blocked + alert.</text><text x="1432" y="1124" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Hasil aksi belum pasti: unknown;</text><text x="1432" y="1149" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">rekonsiliasi sebelum retry.</text><text x="1432" y="1174" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">Failover lintas provider perlu</text><text x="1432" y="1199" font-size="18" fill="#53675d" font-weight="400" text-anchor="start">izin awal dan pengujian.</text><text x="1408" y="1310" font-size="17" fill="#226347" font-weight="700" text-anchor="start">STATUS IMPLEMENTASI</text><text x="1408" y="1342" font-size="17" fill="#53675d" font-weight="400" text-anchor="start">Laporan runtime berasal dari MD baru.</text><text x="1408" y="1367" font-size="17" fill="#53675d" font-weight="400" text-anchor="start">Revisi ini tidak memverifikasi instalasi.</text><text x="88" y="1421" font-size="20" fill="#226347" font-weight="600" text-anchor="start">Satu task store • satu pemilik per tugas • tidak ada done tanpa bukti • keputusan penting tetap milik Arden</text></g></svg>